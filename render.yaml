# Render Blueprint for apps/api (owner decision, 26 September 2026: Render,
# not Fly.io). Render has no Tokyo region; Singapore is the closest to the
# Supabase project in ap-northeast-1.
#
# One always-on web service: the API also runs pg-boss workers and cron-style
# schedules (the morning run, the nightly aggregation, sweeps), so it must
# not sleep. Render's free plan spins down after 15 minutes idle, which would
# stop every scheduled job; `starter` is the smallest always-on plan.
#
# Secrets are `sync: false`: Render asks for each value when the Blueprint is
# first applied, and they never live in this file.
services:
  - type: web
    name: deucex-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    # Node 22.13's bundled corepack has out-of-date npm signing keys and
    # refuses to fetch pnpm ("Cannot find matching keyid"), so install a
    # current corepack first. The first Render deploy failed on exactly this.
    buildCommand: npm install -g corepack@latest && corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @deucex/api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      # Supabase (project gpzpmrumwaqyfkyvqbgl). SUPABASE_DB_URL is the
      # session pooler (port 5432): pg-boss needs session connections.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      # Vendors.
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        value: 'DeuceX <updates@mail.deucex.ai>'
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: audio-files
      # Signs patrons' emailed manage links (step 4.1b); required in production.
      - key: PATRON_LINK_SECRET
        generateValue: true
      # Web Push (step 5.2). The public key must match the web app's
      # NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY on Vercel; without these the API
      # starts but skips push.
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        value: mailto:support@mail.deucex.ai
      # Where emailed links point, and which browser origins may call the API.
      - key: APP_BASE_URL
        value: https://deucex.vercel.app
      # The deployed console has no Supabase settings on Vercel yet, so staff
      # run it locally; this is only where staff-alert emails link to.
      - key: ADMIN_BASE_URL
        value: https://procircuit-admin.vercel.app
      # Comma-separated. The player app calls this API from a browser, and so
      # does the local web dev server, since a local apps/api would run its
      # scheduled jobs alongside this one against the same database. Every
      # request still needs the player's bearer token; CORS isn't the auth.
      - key: CORS_ORIGIN
        value: https://deucex.vercel.app,http://localhost:3000
